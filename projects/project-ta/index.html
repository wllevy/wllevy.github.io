<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Data Collector</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { margin:0; overflow-x:hidden; background:#0f172a; color:#fff; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    #canvas-container { position:fixed; inset:0; z-index:0; pointer-events: none;}
    nav { backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); background: rgba(15, 23, 42, 0.6); border-bottom: 1px solid rgba(255,255,255,0.05); }
    
    /* Glassmorphism Card */
    .content-card { 
        z-index:10; 
        background: rgba(30, 41, 59, 0.4); 
        backdrop-filter: blur(20px); 
        -webkit-backdrop-filter: blur(20px); 
        border: 1px solid rgba(255,255,255,0.1); 
        box-shadow: 0 0 40px rgba(0,0,0,0.4); 
    }

    .nav-link { position:relative; color:#94a3b8; text-decoration:none; transition:color .2s; cursor: pointer;}
    .nav-link:hover { color:#60a5fa; }
    .nav-link::after { content:''; position:absolute; left:0; bottom:-4px; width:0; height:2px; background:#60a5fa; transition: width .2s; }
    .nav-link:hover::after { width:100%; }

    /* Custom Scrollbar for code blocks */
    textarea::-webkit-scrollbar { width: 8px; height: 8px; }
    textarea::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
    textarea::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    textarea::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

    /* Grid Cell Animation */
    .grid-cell { transition: all 0.2s ease; }
    .grid-cell:hover { transform: scale(1.1); z-index: 10; border-color: rgba(96, 165, 250, 0.5); }
    
    /* Tab Animation */
    .tab-content { display: none; animation: fadeIn 0.3s ease-in-out; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <canvas id="canvas-container"></canvas>

  <!-- Navbar -->
  <nav class="fixed top-0 w-full z-50 px-6 py-4 flex justify-between items-center">
    <div class="text-xl font-bold tracking-wider text-white flex items-center gap-3">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-blue-500/30">
        <i class="fa-brands fa-python text-white text-lg"></i>
      </div>
      <span class="bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">DataLab</span>
    </div>

    <div class="hidden md:flex gap-8 text-sm font-medium">
      <span onclick="switchTab('reaction')" class="nav-link text-white">Reaction Test</span>
      <span onclick="switchTab('matrix')" class="nav-link">Matrix Builder</span>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="relative z-10 pt-28 px-4 pb-10 flex justify-center flex-grow">
    <div class="content-card w-full max-w-4xl rounded-3xl p-6 md:p-10 flex flex-col min-h-[600px]">
      
      <!-- Header Area -->
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b border-slate-700/50 pb-6">
        <div>
          <h1 id="page-title" class="text-3xl md:text-4xl font-extrabold text-white">Reaction Timer</h1>
          <p id="page-desc" class="text-slate-400 mt-2 text-sm">Collect reaction data for your statistical analysis assignment.</p>
        </div>
        
        <!-- Mobile Tab Switcher -->
        <div class="flex md:hidden bg-slate-800/50 p-1 rounded-lg mt-4 w-full">
            <button onclick="switchTab('reaction')" class="flex-1 py-2 text-xs font-bold rounded-md transition-colors bg-blue-600 text-white" id="mob-tab-reaction">Timer</button>
            <button onclick="switchTab('matrix')" class="flex-1 py-2 text-xs font-bold rounded-md transition-colors text-slate-400 hover:text-white" id="mob-tab-matrix">Matrix</button>
        </div>
      </div>

      <!-- TAB 1: Reaction Timer -->
      <div id="tab-reaction" class="tab-content active h-full">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 h-full">
            
            <!-- Game Area -->
            <div class="flex flex-col gap-4">
                <div id="game-area" onclick="handleGameClick()" class="relative group cursor-pointer w-full h-64 rounded-2xl bg-slate-800/50 border-2 border-dashed border-slate-600 flex flex-col items-center justify-center transition-all duration-300 hover:border-blue-400 hover:bg-slate-800 overflow-hidden shadow-inner">
                    <!-- Icon & Status -->
                    <i id="game-icon" class="fa-solid fa-bolt text-4xl mb-4 text-slate-500 transition-all duration-300"></i>
                    <h2 id="game-status" class="text-2xl font-bold text-slate-300 select-none">Click to Start</h2>
                    <p id="game-sub" class="text-sm text-slate-500 mt-2 select-none">Wait for green, then click fast!</p>
                    
                    <!-- Ripple Effect Container -->
                    <div class="absolute inset-0 bg-white/5 opacity-0 transition-opacity duration-100" id="flash-overlay"></div>
                </div>

                <div class="flex justify-between items-center bg-slate-900/50 p-4 rounded-xl border border-slate-700/50">
                    <span class="text-slate-400 text-sm">Attempts: <span id="count-badge" class="text-white font-mono font-bold">0</span></span>
                    <button onclick="resetGame()" class="text-xs text-red-400 hover:text-red-300 transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-rotate-right"></i> Reset
                    </button>
                </div>
            </div>

            <!-- Data Output -->
            <div class="flex flex-col h-full">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-bold text-blue-400 uppercase tracking-wider">Generated Python Code</label>
                    <button onclick="copyToClipboard('output-reaction', this)" class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-3 py-1 rounded-md transition-all flex items-center gap-2">
                        <i class="fa-regular fa-copy"></i> Copy
                    </button>
                </div>
                <div class="relative flex-grow">
                    <textarea id="output-reaction" readonly class="w-full h-full min-h-[200px] bg-slate-950/50 border border-slate-700 rounded-xl p-4 font-mono text-sm text-green-400 focus:outline-none focus:border-blue-500 resize-none leading-relaxed">data = np.array([])</textarea>
                </div>
            </div>
        </div>
      </div>

      <!-- TAB 2: Matrix Builder -->
      <div id="tab-matrix" class="tab-content">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- Grid Area -->
            <div class="flex flex-col items-center justify-center bg-slate-800/30 rounded-2xl p-6 border border-slate-700/50">
                <div class="mb-4 text-center">
                    <p class="text-sm text-slate-400">Draw your initial (8x8)</p>
                </div>
                <!-- The Grid -->
                <div id="pixel-grid" class="grid grid-cols-8 gap-1.5 p-2 bg-slate-900 rounded-lg shadow-2xl border border-slate-700">
                    <!-- Cells generated by JS -->
                </div>
                
                <div class="mt-6 flex gap-3">
                    <button onclick="clearGrid()" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-white text-sm transition-all">Clear</button>
                    <button onclick="fillGrid()" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-white text-sm transition-all">Fill</button>
                </div>
            </div>

            <!-- Code Output -->
            <div class="flex flex-col h-full">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-bold text-blue-400 uppercase tracking-wider">Generated Python Code</label>
                    <button onclick="copyToClipboard('output-matrix', this)" class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-3 py-1 rounded-md transition-all flex items-center gap-2">
                        <i class="fa-regular fa-copy"></i> Copy
                    </button>
                </div>
                <div class="relative flex-grow">
                    <textarea id="output-matrix" readonly class="w-full h-full min-h-[300px] bg-slate-950/50 border border-slate-700 rounded-xl p-4 font-mono text-xs md:text-sm text-blue-300 focus:outline-none focus:border-blue-500 resize-none leading-relaxed"></textarea>
                </div>
            </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="relative z-10 py-6 text-center text-slate-500 text-xs">
    <p>Python Control Systems Course &copy; 2026</p>
  </footer>

  <script>
    // --- CANVAS ANIMATION (Starfield/Network) ---
    const canvas = document.getElementById('canvas-container');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.5;
            this.vy = (Math.random() - 0.5) * 0.5;
            this.size = Math.random() * 2 + 1;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0 || this.x > width) this.vx *= -1;
            if (this.y < 0 || this.y > height) this.vy *= -1;
        }
        draw() {
            ctx.fillStyle = 'rgba(148, 163, 184, 0.2)'; // Slate-400 with low opacity
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Create particles
    for (let i = 0; i < 50; i++) particles.push(new Particle());

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        // Draw connections
        particles.forEach((p, index) => {
            p.update();
            p.draw();
            // Connect close particles
            for (let j = index + 1; j < particles.length; j++) {
                const p2 = particles[j];
                const dx = p.x - p2.x;
                const dy = p.y - p2.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 150) {
                    ctx.strokeStyle = `rgba(148, 163, 184, ${0.1 - dist/1500})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
            }
        });
        requestAnimationFrame(animate);
    }
    animate();


    // --- TAB SYSTEM ---
    function switchTab(tabName) {
        // Hide all contents
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        // Show selected
        document.getElementById(`tab-${tabName}`).classList.add('active');
        
        // Update Header Text
        const title = document.getElementById('page-title');
        const desc = document.getElementById('page-desc');
        
        if (tabName === 'reaction') {
            title.innerText = 'Reaction Timer';
            desc.innerText = 'Collect reaction data for your statistical analysis assignment.';
        } else {
            title.innerText = 'Matrix Builder';
            desc.innerText = 'Draw your initial to generate a binary matrix for linear algebra.';
        }

        // Update Mobile Buttons
        const btnR = document.getElementById('mob-tab-reaction');
        const btnM = document.getElementById('mob-tab-matrix');
        if(tabName === 'reaction') {
            btnR.classList.add('bg-blue-600', 'text-white');
            btnR.classList.remove('text-slate-400');
            btnM.classList.remove('bg-blue-600', 'text-white');
            btnM.classList.add('text-slate-400');
        } else {
            btnM.classList.add('bg-blue-600', 'text-white');
            btnM.classList.remove('text-slate-400');
            btnR.classList.remove('bg-blue-600', 'text-white');
            btnR.classList.add('text-slate-400');
        }
    }


    // --- TOOL 1: REACTION GAME ---
    let gameState = 'waiting'; // waiting, ready, green, finished
    let startTime, timeoutId;
    let reactionTimes = [];
    const gameArea = document.getElementById('game-area');
    const gameStatus = document.getElementById('game-status');
    const gameSub = document.getElementById('game-sub');
    const gameIcon = document.getElementById('game-icon');
    const outputReaction = document.getElementById('output-reaction');
    const countBadge = document.getElementById('count-badge');

    function handleGameClick() {
        if (gameState === 'waiting') {
            // Start the sequence
            gameState = 'ready';
            setGameStyle('ready');
            
            const delay = 1500 + Math.random() * 2500; // 1.5s to 4s
            timeoutId = setTimeout(() => {
                gameState = 'green';
                startTime = Date.now();
                setGameStyle('green');
            }, delay);

        } else if (gameState === 'ready') {
            // Too early
            clearTimeout(timeoutId);
            gameState = 'waiting';
            setGameStyle('early');
            setTimeout(() => setGameStyle('waiting'), 1500);

        } else if (gameState === 'green') {
            // Success
            const time = (Date.now() - startTime) / 1000;
            reactionTimes.push(time);
            updateReactionOutput();
            gameState = 'waiting';
            setGameStyle('success', time);
        }
    }

    function setGameStyle(state, timeVal) {
        // Reset classes
        gameArea.className = "relative group cursor-pointer w-full h-64 rounded-2xl border-2 flex flex-col items-center justify-center transition-all duration-200 overflow-hidden shadow-inner select-none";
        
        if (state === 'waiting') {
            gameArea.classList.add('bg-slate-800/50', 'border-dashed', 'border-slate-600', 'hover:border-blue-400', 'hover:bg-slate-800');
            gameStatus.innerText = "Click to Start";
            gameStatus.className = "text-2xl font-bold text-slate-300";
            gameSub.innerText = "Wait for green, then click fast!";
            gameIcon.className = "fa-solid fa-bolt text-4xl mb-4 text-slate-500";
        
        } else if (state === 'ready') {
            gameArea.classList.add('bg-red-900/20', 'border-red-500/50');
            gameStatus.innerText = "Wait for Green...";
            gameStatus.className = "text-2xl font-bold text-red-400 animate-pulse";
            gameSub.innerText = "Do not click yet!";
            gameIcon.className = "fa-regular fa-hand text-4xl mb-4 text-red-400";
        
        } else if (state === 'green') {
            gameArea.classList.add('bg-emerald-600', 'border-emerald-400', 'shadow-[0_0_50px_rgba(16,185,129,0.5)]');
            gameStatus.innerText = "CLICK NOW!";
            gameStatus.className = "text-4xl font-black text-white scale-110";
            gameSub.innerText = "";
            gameIcon.className = "hidden";
        
        } else if (state === 'early') {
            gameArea.classList.add('bg-slate-800', 'border-red-500');
            gameStatus.innerText = "Too Early!";
            gameStatus.className = "text-2xl font-bold text-red-400";
            gameSub.innerText = "Click to try again.";
            gameIcon.className = "fa-solid fa-triangle-exclamation text-4xl mb-4 text-red-500";
        
        } else if (state === 'success') {
            gameArea.classList.add('bg-slate-800', 'border-emerald-500/50');
            gameStatus.innerText = `${timeVal}s`;
            gameStatus.className = "text-4xl font-mono font-bold text-emerald-400";
            gameSub.innerText = "Click to continue";
            gameIcon.className = "fa-solid fa-check text-4xl mb-4 text-emerald-500";
        }
    }

    function updateReactionOutput() {
        countBadge.innerText = reactionTimes.length;
        const arrayStr = reactionTimes.join(', ');
        outputReaction.value = `# Reaction Times Data (n=${reactionTimes.length})\nimport numpy as np\n\nreaction_times = np.array([${arrayStr}])\n\nprint(f"Average: {np.mean(reaction_times):.4f}s")`;
    }

    function resetGame() {
        reactionTimes = [];
        clearTimeout(timeoutId);
        gameState = 'waiting';
        setGameStyle('waiting');
        updateReactionOutput();
        outputReaction.value = "data = np.array([])";
    }


    // --- TOOL 2: MATRIX BUILDER ---
    const gridSize = 8;
    let matrix = Array(gridSize).fill().map(() => Array(gridSize).fill(0));
    const gridContainer = document.getElementById('pixel-grid');
    const outputMatrix = document.getElementById('output-matrix');

    function initGrid() {
        gridContainer.innerHTML = '';
        for(let i=0; i<gridSize; i++) {
            for(let j=0; j<gridSize; j++) {
                const cell = document.createElement('div');
                // Styling the cell
                cell.className = "grid-cell w-8 h-8 md:w-10 md:h-10 rounded bg-slate-800 border border-slate-700 cursor-pointer shadow-sm";
                cell.dataset.r = i;
                cell.dataset.c = j;
                cell.onclick = () => toggleCell(i, j, cell);
                gridContainer.appendChild(cell);
            }
        }
        updateMatrixOutput();
    }

    function toggleCell(r, c, el) {
        const val = matrix[r][c] === 0 ? 1 : 0;
        matrix[r][c] = val;
        
        if (val === 1) {
            el.classList.remove('bg-slate-800', 'border-slate-700');
            el.classList.add('bg-blue-500', 'border-blue-400', 'shadow-[0_0_10px_rgba(59,130,246,0.6)]');
        } else {
            el.classList.add('bg-slate-800', 'border-slate-700');
            el.classList.remove('bg-blue-500', 'border-blue-400', 'shadow-[0_0_10px_rgba(59,130,246,0.6)]');
        }
        updateMatrixOutput();
    }

    function updateMatrixOutput() {
        let code = "# Matrix Representation of Initial\nimport numpy as np\nimport matplotlib.pyplot as plt\n\nmy_initial = np.array([\n";
        matrix.forEach(row => {
            code += "    [" + row.join(", ") + "],\n";
        });
        code += "])\n\n# Visualize\nplt.imshow(my_initial, cmap='Greys')\nplt.show()";
        outputMatrix.value = code;
    }

    function clearGrid() {
        matrix = matrix.map(row => row.fill(0));
        initGrid(); // Re-render is easiest
    }

    function fillGrid() {
        matrix = matrix.map(row => row.fill(1));
        // Manually update UI to avoid full re-render flicker if desired, but initGrid is fast enough
        Array.from(gridContainer.children).forEach(cell => {
             cell.classList.remove('bg-slate-800', 'border-slate-700');
             cell.classList.add('bg-blue-500', 'border-blue-400', 'shadow-[0_0_10px_rgba(59,130,246,0.6)]');
        });
        updateMatrixOutput();
    }


    // --- UTILS ---
    function copyToClipboard(elementId, btn) {
        const copyText = document.getElementById(elementId);
        copyText.select();
        copyText.setSelectionRange(0, 99999); // Mobile
        navigator.clipboard.writeText(copyText.value).then(() => {
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
            btn.classList.add('bg-green-600', 'text-white');
            btn.classList.remove('bg-slate-700');
            
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('bg-green-600', 'text-white');
                btn.classList.add('bg-slate-700');
            }, 2000);
        });
    }

    // Initialize
    initGrid();
    updateReactionOutput(); // Set initial text

  </script>
</body>
</html>
