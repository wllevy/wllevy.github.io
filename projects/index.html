<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(1200px 600px at 20% 10%, rgba(96,165,250,0.18), transparent 60%),
                  radial-gradient(900px 500px at 80% 30%, rgba(192,132,252,0.14), transparent 55%),
                  #0f172a;
      color: #ffffff;
      margin: 0;
      min-height: 100vh;
    }

    nav {
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .nav-link {
      position: relative;
      color: #94a3b8;
      transition: color 0.25s ease;
      text-decoration: none;
    }
    .nav-link:hover { color: #60a5fa; }
    .nav-link::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -4px;
      left: 0;
      background-color: #60a5fa;
      transition: width 0.25s ease;
    }
    .nav-link:hover::after { width: 100%; }

    .content-card {
      background: rgba(30, 41, 59, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.35);
    }

    .gradient-text {
      background: linear-gradient(135deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>

<body>
  <!-- Top Nav -->
  <nav class="fixed top-0 w-full z-50 px-6 py-4 flex justify-between items-center">
    <div class="text-xl font-bold tracking-wider text-white flex items-center gap-2">
      <i class="fa-solid fa-code text-blue-400"></i>
      <a href="/" class="text-white no-underline">MY<span class="text-blue-400">PAGE</span></a>
    </div>

    <div class="hidden md:flex gap-8 text-sm font-medium">
      <a href="/" class="nav-link">Home</a>
      <a href="/projects/" class="nav-link text-blue-200">Projects</a>
      <a href="/blog/" class="nav-link">Blog</a>
      <a href="/about/" class="nav-link">About</a>
    </div>

    <div class="md:hidden text-gray-300 cursor-pointer">
      <i class="fa-solid fa-bars text-xl"></i>
    </div>
  </nav>

  <!-- Main -->
  <main class="pt-28 pb-12 px-4">
    <div class="mx-auto w-full max-w-5xl">
      <header class="mb-8">
        <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight">
          My <span class="gradient-text">Projects</span>
        </h1>
        <p class="mt-3 text-slate-300 max-w-2xl leading-relaxed">
          This is the project list page. Click a card to enter the individual page of each project.
        </p>
      </header>

      <!-- Projects Grid -->
      <section class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <!-- Project: TA -->
        <a href="/projects/project-ta/"
           class="content-card rounded-2xl p-6 transition-transform duration-200 hover:-translate-y-1 hover:border-white/20">
          <div class="flex items-start justify-between gap-4">
            <div>
              <h2 class="text-xl font-bold">project-ta</h2>
              <p class="mt-2 text-sm text-slate-300 leading-relaxed">
                ta dirty work。
              </p>
            </div>
            <div class="shrink-0 w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center">
              <i class="fa-solid fa-arrow-up-right-from-square text-slate-200"></i>
            </div>
          </div>

          <div class="mt-4 flex flex-wrap gap-2">
            <span class="text-xs px-2 py-1 rounded-full bg-white/5 border border-white/10 text-slate-200">HTML</span>
            <span class="text-xs px-2 py-1 rounded-full bg-white/5 border border-white/10 text-slate-200">CSS</span>
            <span class="text-xs px-2 py-1 rounded-full bg-white/5 border border-white/10 text-slate-200">JS</span>
          </div>
        </a>

        <!-- Placeholder card (optional) -->
        <div class="content-card rounded-2xl p-6 border-dashed border-white/10 text-slate-300">
          <h2 class="text-xl font-bold text-slate-200">Next project</h2>
          <p class="mt-2 text-sm leading-relaxed">
            更多项目。
          </p>
        </div>
      </section>

      <footer class="mt-10 text-sm text-slate-400">
        <a href="/" class="text-blue-300 hover:text-blue-200">← Back to Home</a>
      </footer>
    </div>
  </main>
</body>
</html>
